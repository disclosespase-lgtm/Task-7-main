<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый пользователь</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .roles-container {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .role-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #444444;
            border: 1px solid #555555;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
        }
        .role-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            cursor: pointer;
        }
        .role-item span {
            font-size: 13px;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="card" style="width: 420px;">
        <div class="header" style="margin-bottom: 20px;">
            <h2>Новый пользователь</h2>
            <a class="btn btn-edit" th:href="@{/admin/users}">← Назад</a>
        </div>

        <form method="post" th:action="@{/admin/new-user}">
            <label for="firstName">Имя:</label>
            <input type="text" id="firstName" name="firstName" required/>

            <label for="lastName">Фамилия:</label>
            <input type="text" id="lastName" name="lastName" required/>

            <label for="age">Возраст:</label>
            <input type="number" id="age" name="age" required min="1" max="150"/>

            <label for="username">Логин:</label>
            <input type="text" id="username" name="username" required/>

            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required/>

            <label>Роли:</label>
            <div class="roles-container">
                <label class="role-item" th:each="role : ${roles}">
                    <input type="checkbox" name="role" th:value="${role.id}"/>
                    <span th:text="${role.role}"></span>
                </label>
            </div>

            <button type="submit">Создать пользователя</button>
        </form>
    </div>
</div>
</body>
</html>
