<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Личный кабинет</h2>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-delete">Выйти</button>
        </form>
    </div>
    <div class="card">
        <p><strong>Имя:</strong> <span th:text="${user.firstName}"></span></p>
        <p><strong>Фамилия:</strong> <span th:text="${user.lastName}"></span></p>
        <p><strong>Возраст:</strong> <span th:text="${user.age}"></span></p>
        <p><strong>Логин:</strong> <span th:text="${user.username}"></span></p>
    </div>
</div>
</body>
</html>
