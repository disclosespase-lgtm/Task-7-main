<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ панель</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Список пользователей</h2>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-delete">Выйти</button>
        </form>
    </div>
    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Возраст</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.firstName}">Иван</td>
            <td th:text="${user.lastName}">Иванов</td>
            <td th:text="${user.age}">25</td>
            <td class="actions-cell">
                <a class="btn btn-edit" th:href="@{/admin/change-user(id=${user.id})}">Изменить</a>
                <form th:action="@{/admin/delete}" method="POST" class="delete-form">
                    <input type="hidden" name="id" th:value="${user.id}" />
                    <button type="submit" class="btn btn-delete">Удалить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}" style="height: 100px;">
            <td colspan="5" style="text-align: center; color: #aaaaaa;">Нет пользователей</td>
        </tr>
        </tbody>
    </table>
    <div style="display: flex; justify-content: center; margin-top: 16px;">
        <a class="btn btn-add" th:href="@{/admin/new-user}">+ Добавить пользователя</a>
    </div>
</div>
</body>
</html>
