<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="card" style="width: 360px;">
        <h2 style="margin-bottom: 20px; text-align: center;">Авторизация</h2>

        <div th:if="${param.error}" style="color: #ff5555; margin-bottom: 15px; font-size: 14px; text-align: center;">
            Неверный логин или пароль
        </div>
        <div th:if="${param.logout}" style="color: #55ff55; margin-bottom: 15px; font-size: 14px; text-align: center;">
            Вы успешно вышли из системы
        </div>

        <form th:action="@{/login}" method="POST">
            <label for="username">Логин:</label>
            <input type="text" id="username" name="username" placeholder="Введите логин" required/>

            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль" required/>

            <button type="submit" style="margin-top: 16px; width: 100%;">Войти</button>
        </form>
    </div>
</div>
</body>
</html>
